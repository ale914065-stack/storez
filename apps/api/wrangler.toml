name = "store"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Worker phục vụ luôn frontend (build từ apps/web), chỉ /api/* chạy qua Worker
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Tạo thật khi deploy:
#   npx wrangler d1 create store-db      -> điền database_id
#   npx wrangler kv namespace create CART -> điền id
[[d1_databases]]
binding = "DB"
database_name = "store-db"
database_id = "faaba3f8-fb56-42f4-826c-089c0760bf49"

[[kv_namespaces]]
binding = "CART"
id = "18d165d0231348a7843ffe36be38b539"
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "cloudflare-shop-index"